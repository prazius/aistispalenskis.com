<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="container">
            <header>
                <div class="myName">Aistis Palenskis</div>
                <div class="myJob">Software Engineer, Web Developer, Game Developer.</div>
            </header>
            <div class="tab-buttons">

                <button class="tab-btn tab-btn-active" data-for-tab="home">Home</button>
                <button class="tab-btn" data-for-tab="cv">CV</button>
                <button class="tab-btn" data-for-tab="things">Things I've Built</button>

            </div>
            <div class="content">

                <!-- home tab -->
                <div class="tab-content tab-content-active" data-tab="home">
                    <div class="unicodeRow">
                        <span class="keys">⌨ </span>
                        <span class="to-face">↪  ツ</span>
                    </div>
                    <input type="text" id="liveInput" placeholder="type your name to see your face" maxlength="43">
                    <canvas id="canvas_square" width="300" height="300"></canvas>
                    <script type "text/javascript" src="canvas.js"></script>
                </div>

                <!-- CV tab -->
                <div class="tab-content" data-tab="cv">
                    Here goes my cv
                </div>

                <!-- Things tab -->
                <div class="tab-content" data-tab="things">
                    Here go all the things I've built
                </div>
            </div>
        </div>
    </body>
    <script src=setupTabs.js></script>
    <script>
        const reload = new EventSource("/__reload");

        reload.onmessage = () => {
            location.reload();
        };
    </script>
</html>
